{% extends "encyclopedia/layout.html" %}

{% block title%}
New Page
{% endblock %}

{% block body %}

    <h1>Create New Page</h1>
    {% if error %}
    <div class="alert">{{ error }}</div>
    {% endif %}
    <form action="{% url 'encyclopedia:new_page' %}" method="post">
        {% csrf_token %}
        {{ form }}
        <button type="submit">Save</button>
    </form>

{% endblock %}
